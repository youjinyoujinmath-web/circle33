<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>원의 현 탐구실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="config.js"></script>
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<style>
/* 레이아웃: 위에 이름·저장 상태, 그 아래 탭. 탭마다 왼쪽은 방안지 위의 원, 오른쪽은 탐구 패널. 교사에게만 마지막 탭으로 대시보드가 열린다. */
:root{
  --bg:#eef2f6; --surface:#ffffff; --fg:#14213a; --muted:#566178; --line:#d3dae6; --grid:#e3e9f1;
  --accent:#2155d4; --accent-ink:#ffffff; --bis:#0b8a78; --alt:#b35c00;
  --ok:#1a7f4b; --okbg:#e3f4ea; --warn:#8a5200; --warnbg:#fff1d6; --bad:#b3261e; --badbg:#fde6e4;
  --font-display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1626; --surface:#16213a; --fg:#e6ecf8; --muted:#9aa7c2; --line:#2a3858; --grid:#1f2c49;
    --accent:#6c93ff; --accent-ink:#0b1020; --bis:#3ccfb6; --alt:#f0a64a;
    --ok:#58d08e; --okbg:#123325; --warn:#f0b95a; --warnbg:#3a2a0a; --bad:#ff8b82; --badbg:#3f1a18;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1626; --surface:#16213a; --fg:#e6ecf8; --muted:#9aa7c2; --line:#2a3858; --grid:#1f2c49;
  --accent:#6c93ff; --accent-ink:#0b1020; --bis:#3ccfb6; --alt:#f0a64a;
  --ok:#58d08e; --okbg:#123325; --warn:#f0b95a; --warnbg:#3a2a0a; --bad:#ff8b82; --badbg:#3f1a18;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.6 var(--font-body);padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:1120px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
h1{font:400 32px/1.15 var(--font-display);margin:0;letter-spacing:.01em;text-wrap:balance}
h2{font:400 21px/1.3 var(--font-display);margin:0;text-wrap:balance}
.sub{margin:4px 0 0;color:var(--muted);font-size:13px}
.who{display:flex;flex-direction:column;gap:6px;min-width:0;width:min(100%,360px)}
.who .row{display:flex;gap:8px;align-items:center;min-width:0}
.lbl{font-size:12px;color:var(--muted);letter-spacing:.06em;display:block;margin-bottom:4px}
input[type=text],input[type=password],textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0;width:100%}
textarea{resize:vertical;line-height:1.5}
input:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible,[role=tab]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sync{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.gate{max-width:420px;margin:40px auto}
.sync.s-ok i{background:var(--ok)} .sync.s-warn i{background:var(--alt)} .sync.s-wait i{background:var(--muted)}

.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabs button{font:500 15px var(--font-body);background:none;color:var(--muted);border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;display:flex;align-items:center;gap:8px;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--fg);border-bottom-color:var(--accent)}
.dot{width:9px;height:9px;border-radius:50%;border:2px solid var(--muted);flex:none}
.dot.s1{border-color:var(--alt);background:linear-gradient(90deg,var(--alt) 50%,transparent 50%)}
.dot.s2{border-color:var(--ok);background:var(--ok)}

.stage{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:900px){
  .stage{grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:start}
  .canvas{position:sticky;top:12px}
}
.canvas{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px}
.canvas svg{display:block;width:100%;height:auto;max-width:560px;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-direction:column;gap:14px;min-width:0}
.block{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.goal{margin:6px 0 0;color:var(--muted)}
.steps{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.steps li::marker{color:var(--accent);font-weight:700}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:500 14px var(--font-body);padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.msg{margin:10px 0 0;min-height:1.6em;color:var(--muted);font-size:14px}
.slide{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.slide input[type=range]{flex:1 1 140px;min-width:0;accent-color:var(--accent)}
.read{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin-top:10px}
.cell{border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
.cell small{display:block;color:var(--muted);font-size:12px}
.cell b{font:500 19px var(--font-mono);font-variant-numeric:tabular-nums}
.eq{margin:10px 0 0;font:400 13px/1.6 var(--font-mono);color:var(--muted);overflow-wrap:anywhere}
.tblwrap{overflow-x:auto;margin-top:10px}
.tbl{width:100%;border-collapse:collapse;font:400 13px var(--font-mono);font-variant-numeric:tabular-nums}
.tbl th{font:500 12px var(--font-body);color:var(--muted);text-align:right;padding:4px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{text-align:right;padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.banner{margin-top:10px;padding:8px 12px;border-radius:6px;font-size:14px;background:var(--warnbg);color:var(--warn)}
.banner.ok{background:var(--okbg);color:var(--ok)}

.q{border-top:1px solid var(--line);padding-top:12px;margin-top:12px;display:flex;flex-direction:column;gap:6px}
.q:first-child{border-top:0;padding-top:0;margin-top:0}
.qt{margin:0 0 2px;font-weight:500}
.opt{font:400 14px/1.45 var(--font-body);text-align:left;width:100%;padding:8px 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--bg)}
.block>h2+.q{border-top:0;padding-top:0;margin-top:10px}
.opt.ok{border-color:var(--ok);background:var(--okbg);color:var(--fg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
.numrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.numin{width:110px;font-family:var(--font-mono)}
.unit{color:var(--muted)}
.fb{margin:2px 0 0;font-size:14px;min-height:1.4em}
.fb.good{color:var(--ok)} .fb.try{color:var(--warn)}

.pad{display:block;width:100%;height:280px;border:1px solid var(--line);border-radius:8px;touch-action:none;cursor:crosshair;background:var(--surface);user-select:none;-webkit-user-select:none}
.pad.erase{cursor:cell}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.tools .btn[aria-pressed=true]{border-color:var(--accent);background:var(--bg);font-weight:700}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);padding:0;cursor:pointer}
.swatch[aria-pressed=true]{border-color:var(--fg);outline:2px solid var(--surface);outline-offset:-5px}
.tools input[type=range]{width:90px;accent-color:var(--accent)}
.sol{margin-top:10px;padding:10px 12px;border-radius:6px;background:var(--bg);font-size:14px}
.sol p{margin:4px 0}
details.hint{margin-top:10px}
details.hint summary{cursor:pointer;color:var(--accent);font-weight:500}
.sv .gl{stroke:var(--grid);stroke-width:1}
.sv .bgrect{fill:var(--surface)}
.sv .circ{fill:none;stroke:var(--fg);stroke-width:2.5}
.sv .chord{stroke:var(--accent);stroke-width:4.5;stroke-linecap:round}
.sv .chord2{stroke:var(--alt);stroke-width:4.5;stroke-linecap:round}
.sv .chordf{stroke:var(--muted);stroke-width:2.5;stroke-linecap:round}
.sv .tan{stroke:var(--ok);stroke-width:4.5;stroke-linecap:round}
.sv .bis{stroke:var(--bis);stroke-width:2.5;stroke-dasharray:7 6;fill:none}
.sv .bisf{stroke:var(--bis);stroke-width:2;stroke-dasharray:7 6;opacity:.65}
.sv .om{stroke:var(--bis);stroke-width:3.5;stroke-linecap:round}
.sv .om2{stroke:var(--alt);stroke-width:3.5;stroke-linecap:round;stroke-dasharray:2 6}
.sv .rad{stroke:var(--muted);stroke-width:2;stroke-dasharray:3 5}
.sv .mark{fill:none;stroke:var(--fg);stroke-width:1.8}
.sv .odot{fill:var(--fg)}
.sv .mdot{fill:var(--bis)}
.sv .handle{cursor:grab;outline:none}
.sv .handle circle{fill:var(--accent);stroke:var(--surface);stroke-width:3}
.sv .handle.h2 circle{fill:var(--alt)}
.sv .handle.hm circle{fill:var(--bis)}
.sv .handle:focus-visible circle{stroke:var(--fg)}
.sv .handle.drag{cursor:grabbing}
.sv .hl{fill:var(--accent-ink);font:700 13px var(--font-body);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.sv .lab{fill:var(--fg);font:600 14px var(--font-body);paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round;text-anchor:middle;dominant-baseline:central;pointer-events:none}

.pill{display:inline-block;font-size:12px;font-weight:500;padding:2px 9px;border-radius:99px;white-space:nowrap;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.pill.s1{background:var(--warnbg);color:var(--warn);border-color:transparent}
.pill.s2{background:var(--okbg);color:var(--ok);border-color:transparent}
.pill.alert{background:var(--badbg);color:var(--bad);border-color:transparent}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:12px}
.sumgrid .cell b{font-size:24px}
.meter{height:6px;border-radius:3px;background:var(--bg);overflow:hidden;margin-top:6px}
.meter span{display:block;height:100%;background:var(--accent)}
.qrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:6px 16px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.qrow:first-of-type{border-top:0}
.qrow p{margin:0;font-size:14px}
.qrow small{color:var(--muted);font-size:12px}
@media (max-width:640px){.qrow{grid-template-columns:minmax(0,1fr)}}
.stuhead,.stusum{display:grid;grid-template-columns:minmax(110px,1.5fr) repeat(5,minmax(74px,1fr)) 56px 92px;gap:8px;align-items:center}
.stuhead{padding:0 12px 6px;font-size:12px;color:var(--muted);letter-spacing:.04em}
details.stu{border:1px solid var(--line);border-radius:8px;margin-top:8px;background:var(--surface)}
details.stu summary{list-style:none;cursor:pointer;padding:10px 12px}
details.stu summary::-webkit-details-marker{display:none}
.stusum .nm{font-weight:500;overflow-wrap:anywhere}
.stusum .num{font:400 13px var(--font-mono);color:var(--muted)}
.stubody{padding:4px 12px 14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;border-top:1px solid var(--line)}
.stubody h3{font:400 16px var(--font-display);margin:10px 0 6px}
.stubody p{margin:4px 0;font-size:13px;overflow-wrap:anywhere}
.stubody .wrong{color:var(--muted)}
.note{border-left:3px solid var(--line);padding-left:10px;margin:6px 0 0;font-size:13px;overflow-wrap:anywhere;white-space:pre-wrap}
@media (max-width:760px){
  .stuhead{display:none}
  .stusum{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stusum .nm{grid-column:1/-1}
  .stusum .num{display:none}
}
.codebox{margin-top:18px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:12px 16px}
.codebox summary{cursor:pointer;font-weight:500}
.codebox textarea{font-family:var(--font-mono);font-size:12px;margin-top:8px}
.mk{padding:1px 3px;border-bottom:3px solid var(--accent);white-space:normal}
.mk.con{border-bottom-color:var(--alt)}
.tag{display:inline-block;font:700 11px/1.6 var(--font-body);padding:0 7px;border-radius:99px;margin-left:4px;vertical-align:2px;color:var(--accent-ink);background:var(--accent)}
.mk.con .tag{background:var(--alt)}
.ex{margin-top:10px;padding:10px 12px;border-radius:6px;background:var(--bg);line-height:2.2}
.ex p{margin:2px 0}
.ex small{color:var(--muted);font-size:12px;letter-spacing:.04em}
.symbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:2px 0 4px}
.symbar .sym{font:500 17px var(--font-body);min-width:42px;padding:4px 10px}
.stack{display:flex;flex-direction:column;gap:14px}
.modebar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.modebar button{font:500 14px var(--font-body);padding:8px 16px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.modebar button[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips button{font:500 13px var(--font-body);padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.chips button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chips button span{opacity:.75;margin-left:4px;font-variant-numeric:tabular-nums}
.cmp td,.cmp th{text-align:right}
.cmp tr.click{cursor:pointer}
.cmp tr.click:hover td{background:var(--bg)}
.proofpage{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.pagebar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.crumb{font-size:13px;color:var(--muted)}
.crumb b{color:var(--accent);font-weight:700}
.nextbox{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.nextbox p{margin:0}
.rule{border:2px solid var(--accent);border-radius:10px;padding:14px 16px;background:var(--surface)}
.rule ol{margin:8px 0 0;padding-left:22px}
.rule li{margin:4px 0}
.mine{color:var(--muted);font-size:13px;display:block;overflow-wrap:anywhere}
.tlink{float:right;color:var(--muted);text-decoration:none;font-size:12px;padding:2px 6px;border-radius:4px;opacity:.7}
.tlink:hover,.tlink:focus-visible{opacity:1;text-decoration:underline}
.foot{margin-top:24px;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>원의 현 탐구실</h1>
      <p class="sub">중3 수학 · 원과 현의 성질 · 점을 끌어 보며 직접 발견해 보세요</p>
    </div>
    <div class="who">
      <label class="lbl" for="name">이름과 나만의 번호</label>
      <div class="row"><input id="name" type="text" maxlength="12" placeholder="학번이름 (예: 3401김유진)" autocomplete="off" aria-describedby="namehint"><input id="pin" type="text" inputmode="numeric" maxlength="4" placeholder="번호 4자리" autocomplete="off" aria-label="나만의 번호 4자리" aria-describedby="namehint" style="width:110px;flex:none;font-family:var(--font-mono)"></div>
      <p class="sub" id="namehint" style="margin:0">학번이름과, 내가 정한 숫자 4자리를 써 주세요. 다른 기기에서 이어 할 때 같은 번호가 필요해요.</p>
      <div class="sync s-wait" id="sync"><i></i><span id="synctxt">연결 중</span></div>
    </div>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="탐구 활동"></nav>
  <main id="view"></main>
  <details class="codebox" id="codebox" hidden>
    <summary>선생님 화면에 기록이 저장되지 않을 때 쓰는 제출 코드</summary>
    <p class="sub">이 기기에만 기록이 저장되고 있습니다. 아래 코드를 복사해서 선생님께 보내 주세요. 활동을 더 하면 코드가 바뀌니, 마지막에 다시 복사해 주세요.</p>
    <textarea id="codeta" rows="3" readonly aria-label="제출 코드"></textarea>
    <div class="ctrl" style="margin-top:8px"><button class="btn" id="copycode" type="button">코드 복사</button><span class="sub" id="copymsg"></span></div>
  </details>
  <p class="foot">원의 중심에서 현에 내린 수선은 그 현을 이등분합니다. 같은 이유로 현의 수직이등분선은 원의 중심을 지납니다.<a class="tlink" id="tlink" href="teacher.html" title="교사용 화면 (단축키 Alt+Shift+T)">교사용</a></p>
</div>

function buildBoard(){
  var strokes=[], cur=null, erasing=false, tool='pen', colorKey='fg', width=3;
  var COL={fg:'--fg',accent:'--accent',alt:'--alt'};
  var cvs=h('canvas',{class:'pad','aria-label':'계산용 필기 보드. 마우스나 펜으로 쓸 수 있습니다.'});
  var ctx=cvs.getContext('2d');
  function tok(k){ return getComputedStyle(document.documentElement).getPropertyValue(k).trim()||'#888'; }
  function drawStroke(s){
    ctx.strokeStyle=tok(COL[s.c]); ctx.fillStyle=ctx.strokeStyle;
    if(s.pts.length===1){ ctx.beginPath(); ctx.arc(s.pts[0].x,s.pts[0].y,s.w*(0.5+s.pts[0].p)/2,0,Math.PI*2); ctx.fill(); return; }
    for(var i=1;i<s.pts.length;i++){
      ctx.lineWidth=s.w*(0.5+s.pts[i].p);
      ctx.beginPath(); ctx.moveTo(s.pts[i-1].x,s.pts[i-1].y); ctx.lineTo(s.pts[i].x,s.pts[i].y); ctx.stroke();
    }
  }
  function redraw(){
    var w=cvs.clientWidth, hh=cvs.clientHeight; if(!w||!hh) return;
    var dpr=window.devicePixelRatio||1;
    if(cvs.width!==Math.round(w*dpr)||cvs.height!==Math.round(hh*dpr)){ cvs.width=Math.round(w*dpr); cvs.height=Math.round(hh*dpr); }
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle=tok('--surface'); ctx.fillRect(0,0,w,hh);
    ctx.strokeStyle=tok('--grid'); ctx.lineWidth=1; ctx.beginPath();
    for(var x=20;x<w;x+=20){ ctx.moveTo(x+0.5,0); ctx.lineTo(x+0.5,hh); }
    for(var y=20;y<hh;y+=20){ ctx.moveTo(0,y+0.5); ctx.lineTo(w,y+0.5); }
    ctx.stroke();
    ctx.lineCap='round'; ctx.lineJoin='round';
    strokes.forEach(drawStroke);
  }
  function pos(e){ var r=cvs.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top,p:e.pointerType==='pen'&&e.pressure>0?e.pressure:0.5}; }
  function erase(q){
    var n=strokes.length;
    strokes=strokes.filter(function(s){ return !s.pts.some(function(pt){ return Math.hypot(pt.x-q.x,pt.y-q.y)<14; }); });
    if(strokes.length!==n) redraw();
  }
  cvs.addEventListener('pointerdown',function(e){
    if(e.pointerType==='mouse'&&e.button!==0) return;
    e.preventDefault(); cvs.setPointerCapture(e.pointerId);
    var q=pos(e);
    if(tool==='eraser'){ erasing=true; erase(q); }
    else { cur={c:colorKey,w:width,pts:[q]}; strokes.push(cur); redraw(); }
  });
  cvs.addEventListener('pointermove',function(e){
    if(!cvs.hasPointerCapture(e.pointerId)) return;
    var q=pos(e);
    if(erasing){ erase(q); return; }
    if(!cur) return;
    var last=cur.pts[cur.pts.length-1];
    if(Math.hypot(q.x-last.x,q.y-last.y)<0.8) return;
    cur.pts.push(q);
    ctx.lineCap='round'; ctx.strokeStyle=tok(COL[cur.c]); ctx.lineWidth=cur.w*(0.5+q.p);
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(q.x,q.y); ctx.stroke();
  });
  var end=function(){ cur=null; erasing=false; };
  cvs.addEventListener('pointerup',end); cvs.addEventListener('pointercancel',end);
  if(window.ResizeObserver) new ResizeObserver(redraw).observe(cvs);
  try{ window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',redraw); }catch(e){}
  new MutationObserver(redraw).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

  var bPen=h('button',{class:'btn',type:'button','aria-pressed':'true'},'펜'), bEr=h('button',{class:'btn',type:'button','aria-pressed':'false'},'지우개');
  function setTool(t){ tool=t; bPen.setAttribute('aria-pressed',t==='pen'); bEr.setAttribute('aria-pressed',t==='eraser'); cvs.classList.toggle('erase',t==='eraser'); }
  bPen.addEventListener('click',function(){ setTool('pen'); }); bEr.addEventListener('click',function(){ setTool('eraser'); });
  var sw=[['fg','검정'],['accent','파랑'],['alt','주황']].map(function(c){
    var b=h('button',{class:'swatch',type:'button','aria-label':c[1]+' 펜','aria-pressed':c[0]==='fg'?'true':'false',style:'background:var('+COL[c[0]]+')'});
    b.addEventListener('click',function(){ colorKey=c[0]; setTool('pen'); sw.forEach(function(x){ x.setAttribute('aria-pressed',x===b?'true':'false'); }); });
    return b;
  });
  var wr=h('input',{type:'range',min:1,max:8,step:1,value:3,'aria-label':'펜 굵기'});
  wr.addEventListener('input',function(){ width=parseFloat(wr.value); });
  var bUn=h('button',{class:'btn',type:'button'},'되돌리기'), bCl=h('button',{class:'btn',type:'button'},'모두 지우기');
  bUn.addEventListener('click',function(){ strokes.pop(); redraw(); });
  bCl.addEventListener('click',function(){ strokes=[]; redraw(); });
  return h('div',{class:'block'},h('h2',{},'계산 보드'),
    h('p',{class:'goal'},'마우스나 터치펜으로 식을 쓰고 계산해 보세요. 이 보드의 내용은 저장되지 않습니다.'),
    h('div',{class:'tools'},bPen,bEr,sw,wr,bUn,bCl),cvs);
}

function buildDash(){
  var root=h('section',{id:'p-dash',class:'panel','aria-label':'교사 대시보드'});
  var cls='all'; try{ cls=localStorage.getItem(KEY+'-cls')||'all'; }catch(e){}
  var stamp=h('span',{class:'sub'}), refreshBtn=h('button',{class:'btn',type:'button'},'새로고침'), extraTools=[];
  var records=[], openSet={}, errText='';
  var importTa=h('textarea',{id:'importta',rows:5,placeholder:'학생이 보낸 제출 코드를 붙여 넣으세요.','aria-label':'제출 코드'});
  var importMsg=h('p',{class:'msg',role:'status'});

  function decode(raw){
    try{
      var bin=atob(raw), bytes=new Uint8Array(bin.length);
      for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);

  }
  importBtn.addEventListener('click',function(){
    var parts=importTa.value.split(/\s+/).filter(function(x){return x.length>20;});
    if(!parts.length) return;

    var recs=[], bad=0;
    parts.forEach(function(x){ var r=decode(x); if(r) recs.push(r); else bad++; });
    if(!recs.length){ importMsg.textContent='읽을 수 있는 코드가 없습니다. 코드 전체를 복사했는지 확인해 주세요.'; return; }

      hh=g; g=f; f=e; e=(d+t1)|0; d=c; c=bb; bb=a; a=(t1+t2)|0;
    }
    H[0]=(H[0]+a)|0; H[1]=(H[1]+bb)|0; H[2]=(H[2]+c)|0; H[3]=(H[3]+d)|0; H[4]=(H[4]+e)|0; H[5]=(H[5]+f)|0; H[6]=(H[6]+g)|0; H[7]=(H[7]+hh)|0;
  }
  return H.map(function(x){ return ('00000000'+(x>>>0).toString(16)).slice(-8); }).join('');
}
/* 아이디·비밀번호를 그대로 적지 않고, 되돌릴 수 없는 형태(해시)로만 페이지에 넣는다 */
function loginHash(id,pw){
  var x='circle-chord-lab|'+id.trim()+'|'+pw;
  for(var i=0;i<20000;i++) x=sha256hex(x+'|'+i);
  return x;
}
function startTeacher(){
  document.querySelector('.who').hidden=true;
  ['tabs','view','codebox'].forEach(function(id){ document.getElementById(id).hidden=true; });
  document.querySelector('.top .sub').textContent='교사 대시보드 · 교사 계정으로 로그인한 사람만 학생 기록을 볼 수 있습니다';
  document.title='원의 현 탐구실 · 교사 대시보드';
  var tl=document.getElementById('tlink'); tl.href='index.html'; tl.textContent='학생 화면으로'; tl.title='학생 화면 (단축키 Alt+Shift+T)';
  var dash=buildDash(); dash.root.hidden=true;
  var idIn=h('input',{type:'text',id:'tid',autocomplete:'username',placeholder:'아이디'});
  var pw=h('input',{type:'password',id:'tpw',autocomplete:'current-password',placeholder:'비밀번호'});
  var go=h('button',{class:'btn primary',type:'button',style:'width:100%'},'로그인'), msg=h('p',{class:'msg',role:'status'});
  var gate=h('div',{class:'block gate'},h('h2',{},'교사 로그인'),
    h('p',{class:'goal'},'교사용 아이디와 비밀번호를 입력하세요.'),
    h('div',{style:'display:flex;flex-direction:column;gap:8px;margin-top:12px'},idIn,pw,go),msg);
  var logout=h('button',{class:'btn',type:'button'},'로그아웃');
  document.getElementById('view').after(gate,dash.root);
  var HASH=typeof window.TEACHER_HASH==='string'?window.TEACHER_HASH:'';
  if(!/^[0-9a-f]{64}$/.test(HASH)){ msg.textContent='교사 계정이 아직 설정되지 않았습니다. 계정설정.html로 만든 줄을 teacher.html에 넣어 주세요.'; go.disabled=true; return; }

  var ID='', PASS='', timer=0, LKEY=KEY+'-teacher-records';
  function localRows(){ try{ return JSON.parse(localStorage.getItem(LKEY)||'[]'); }catch(e){ return []; } }
  function load(first){
    if(!SHEET_URL){
      dash.set(localRows().map(function(x){ return {id:x.name,pin:'',rec:norm(x.rec)}; }),Date.now());
      return Promise.resolve(true);
    }
    return api({action:'list',id:ID,password:PASS}).then(function(res){
      if(!res||!res.ok){ if(first) msg.textContent=res&&res.error==='password'?(/^\/api\//.test(SHEET_URL)?'저장소의 교사 계정 설정(TEACHER_HASH)이 이 페이지와 다릅니다.':'구글 시트 코드(Code.gs)의 아이디·비밀번호가 이 페이지와 다릅니다.'):'기록을 불러오지 못했습니다. 잠시 뒤 다시 시도해 주세요.'; else dash.error(); return false; }
      dash.set(res.rows.map(function(x){ return {id:x.name,pin:x.pin,rec:norm(x.rec)}; }),Date.now());
      return true;
    }).catch(function(){ if(first) msg.textContent='저장소에 연결하지 못했습니다. 인터넷 연결과 config.js 주소를 확인해 주세요.'; else dash.error(); return false; });
  }
  function enter(){
    gate.hidden=true; dash.root.hidden=false;
    try{ sessionStorage.setItem(KEY+'-tses',JSON.stringify([ID,PASS])); }catch(e){}
    clearInterval(timer); if(SHEET_URL) timer=setInterval(function(){ if(!document.hidden) load(false); },30000);
  }
  function login(id,p,silent){
    if(!id||!p) return;
    go.disabled=true; msg.textContent='확인하는 중…';
    setTimeout(function(){
      if(loginHash(id,p)!==HASH){ go.disabled=false; msg.textContent=silent?'':'아이디 또는 비밀번호가 맞지 않습니다.'; pw.value=''; return; }
      ID=id.trim(); PASS=p; msg.textContent='불러오는 중…';
      load(true).then(function(ok){ go.disabled=false; if(ok){ msg.textContent=''; enter(); } });
    },30);
  }
  dashImport=function(recs){
    if(!SHEET_URL){
      var rows=localRows();
      recs.forEach(function(rec){
        var nm=rec.name.trim(), i=rows.findIndex(function(x){return x.name===nm;});
        if(i<0) rows.push({name:nm,rec:rec});
        else if((rows[i].rec.updatedAt||0)<=(rec.updatedAt||0)) rows[i]={name:nm,rec:rec};
      });
      try{ localStorage.setItem(LKEY,JSON.stringify(rows)); }catch(e){ return Promise.resolve(0); }
      return load(false).then(function(){ return recs.length; });
    }
    var n=0;
    return recs.reduce(function(pr,rec){
      return pr.then(function(){ return api({action:'import',id:ID,password:PASS,rec:rec}).then(function(r){ if(r&&r.ok) n++; }).catch(function(){}); });
    },Promise.resolve()).then(function(){ return load(false).then(function(){ return n; }); });
  };
  dash.onRefresh(function(){ load(false); });
  dash.addTool(logout);
  logout.addEventListener('click',function(){
    try{ sessionStorage.removeItem(KEY+'-tses'); }catch(e){}
    clearInterval(timer); ID=''; PASS=''; pw.value=''; dash.root.hidden=true; gate.hidden=false; msg.textContent='로그아웃했습니다.';
  });
  go.addEventListener('click',function(){ login(idIn.value,pw.value); });
  [idIn,pw].forEach(function(x){ x.addEventListener('keydown',function(e){ if(e.key==='Enter') login(idIn.value,pw.value); }); });
  try{ var ses=JSON.parse(sessionStorage.getItem(KEY+'-tses')||'null'); if(ses){ idIn.value=ses[0]; login(ses[0],ses[1],true); } }catch(e){}
}

document.addEventListener('keydown',function(e){
  if(e.altKey&&e.shiftKey&&!e.ctrlKey&&!e.metaKey&&e.code==='KeyT'){
    e.preventDefault(); location.href=PAGE==='teacher'?'index.html':'teacher.html';
  }
});
function init(){
  if(PAGE==='teacher'){ startTeacher(); return; }
  if(mode!=='cloud'){
    setSync('local'); showCode();
    var cb=document.getElementById('codebox'); cb.open=true;
    cb.querySelector('summary').textContent='선생님께 낼 제출 코드';
    cb.querySelector('p').textContent='활동을 마치면 아래 코드를 복사해서 선생님이 알려 준 곳(클래스룸, 패들렛 등)에 붙여 넣어 내세요. 활동을 더 하면 코드가 바뀌니, 마지막에 다시 복사해 주세요.';
    return;
  }
  commit();
}
init();
})();
